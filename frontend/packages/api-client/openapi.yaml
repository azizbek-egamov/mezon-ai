components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
          description: Yangi (rotatsiya); cookie rejimida tanada bo'lmaydi
      required:
      - access
    AdminPlan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: FREE, PRO_MONTHLY, ENTERPRISE_YEARLY yoki yangi kod
          maxLength: 30
        name:
          type: string
          description: Interfeysda ko'rsatiladigan nom (standart kodlar tarjima qilinadi)
          maxLength: 80
        display_name:
          type: string
          readOnly: true
        price_uzs:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        duration_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Obuna muddati (kun); FREE uchun bo'sh
        daily_case_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        monthly_case_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        lifetime_case_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Umrbod (FREE = 1)
        max_pages_per_case:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        daily_chat_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        lifetime_chat_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        daily_template_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        lifetime_template_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        watermark:
          type: boolean
          description: Shablonlarga "bepul tarif" belgisi qo'shiladi
        priority_queue:
          type: boolean
          description: Ish tahlili navbatida oldinda
        is_active:
          type: boolean
          description: Faolsiz tarif yangi obunaga berilmaydi
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        subscribers:
          type: integer
          readOnly: true
          default: 0
      required:
      - code
      - display_name
      - id
      - name
      - subscribers
    AdminPlanRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: FREE, PRO_MONTHLY, ENTERPRISE_YEARLY yoki yangi kod
          maxLength: 30
        name:
          type: string
          minLength: 1
          description: Interfeysda ko'rsatiladigan nom (standart kodlar tarjima qilinadi)
          maxLength: 80
        price_uzs:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        duration_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Obuna muddati (kun); FREE uchun bo'sh
        daily_case_limit:
          type: integer
          maximum: 9223372036854775807
