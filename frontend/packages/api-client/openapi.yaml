openapi: 3.0.3
info:
  title: MEZON AI API
  version: 1.0.0
  description: 'Veb, admin va mobil ilova uchun JSON API (TZ v2.1). Autentifikatsiya:
    `Authorization: Bearer <access>`.'
paths:
  /api/v1/admin/antifraud:
    get:
      operationId: admin_antifraud_retrieve
      parameters:
      - in: query
        name: min
        schema:
          type: integer
        description: Bitta IP dagi kamida akkaunt (sukut 3)
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/audit/:
    get:
      operationId: admin_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: target
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/admin/costs:
    get:
      operationId: admin_costs_retrieve
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 7–90, sukut 30
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/dashboard:
    get:
      operationId: admin_dashboard_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/me:
    get:
      operationId: admin_me_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
  /api/v1/admin/payments/:
    get:
      operationId: admin_payments_list
      description: To'lovlar; qo'lda yaratish (provider=MANUAL — naqd/bank o'tkazmasi),
        keyin "to'langan deb belgilash".
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELED
          - FAILED
          - PAID
          - PENDING
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
    post:
      operationId: admin_payments_create
      description: To'lovlar; qo'lda yaratish (provider=MANUAL — naqd/bank o'tkazmasi),
        keyin "to'langan deb belgilash".
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/admin/payments/{payment_id}/cancel:
    post:
      operationId: admin_payments_cancel_create
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/admin/payments/{payment_id}/mark-paid:
    post:
      operationId: admin_payments_mark_paid_create
      description: To'lov tasdiqlandi → obuna yoqiladi (quota.mark_paid; takror chaqirish
        xavfsiz)
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/admin/plans/:
    get:
      operationId: admin_plans_list
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPlan'
          description: ''
    post:
      operationId: admin_plans_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPlanRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlan'
          description: ''
  /api/v1/admin/plans/{plan_id}:
    get:
      operationId: admin_plans_retrieve
      description: 'Tarif konstruktori: limitlar, narx, muddat, faollik. O''chirish
        yo''q — `is_active=false` (obunalar saqlanadi).'
      parameters:
      - in: path
        name: plan_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlan'
          description: ''
    patch:
      operationId: admin_plans_partial_update
      description: 'Tarif konstruktori: limitlar, narx, muddat, faollik. O''chirish
        yo''q — `is_active=false` (obunalar saqlanadi).'
      parameters:
      - in: path
        name: plan_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminPlanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminPlanRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlan'
          description: ''
  /api/v1/admin/subscriptions/:
    get:
      operationId: admin_subscriptions_list
      parameters:
      - in: query
        name: current
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubscriptionList'
          description: ''
  /api/v1/admin/subscriptions/{sub_id}/cancel:
    post:
      operationId: admin_subscriptions_cancel_create
      parameters:
      - in: path
        name: sub_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/admin/sync/:
    get:
      operationId: admin_sync_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSyncRunList'
          description: ''
  /api/v1/admin/sync/start:
    post:
      operationId: admin_sync_start_create
      description: '{"days": 7, "check_codes": false}'
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/admin/templates/:
    get:
      operationId: admin_templates_list
      parameters:
      - in: query
        name: pending
        schema:
          type: boolean
        description: Faqat tasdiqlanmaganlar
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateListItem'
          description: ''
    post:
      operationId: admin_templates_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTemplateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminTemplateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
          description: ''
  /api/v1/admin/templates/{template_id}:
    get:
      operationId: admin_templates_retrieve
      description: Matn yoki sxema o'zgarsa — versiya oshadi va tasdiq bekor bo'ladi
        (DocumentTemplate.save).
      parameters:
      - in: path
        name: template_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
          description: ''
    patch:
      operationId: admin_templates_partial_update
      description: Matn yoki sxema o'zgarsa — versiya oshadi va tasdiq bekor bo'ladi
        (DocumentTemplate.save).
      parameters:
      - in: path
        name: template_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminTemplateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminTemplateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
          description: ''
  /api/v1/admin/templates/{template_id}/approve:
    post:
      operationId: admin_templates_approve_create
      description: Joriy versiyani tasdiqlash va e'lon qilish (yurist-moderator)
      parameters:
      - in: path
        name: template_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
          description: ''
  /api/v1/admin/templates/{template_id}/preview:
    post:
      operationId: admin_templates_preview_create
      description: Moderator e'lon qilinmagan shablonni ham sinab ko'radi (kvota olinmaydi,
        ma'lumot saqlanmaydi).
      parameters:
      - in: path
        name: template_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateValuesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateValuesRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      parameters:
      - in: query
        name: flagged
        schema:
          type: boolean
      - in: query
        name: ip
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/v1/admin/users/{user_id}:
    get:
      operationId: admin_users_retrieve
      description: Profil, sarf, obunalar, to'lovlar, ishlar metama'lumoti, jurnal
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: 'O''zgartirish mumkin: full_name, role, advocate_license_no, is_active,
        is_fraud_flagged'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/subscriptions:
    post:
      operationId: admin_users_subscriptions_create
      description: 'Obuna berish (qo''lda): tarif va muddat; shu tarifning faol obunasi
        bo''lsa — oxiridan uzaytiriladi.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GrantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/auth/language:
    post:
      operationId: auth_language_create
      description: 'Interfeys tili: kirgan bo''lsa — profilga, har holda `django_language`
        cookie ga (HTML sahifalar bilan umumiy).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LanguageRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Language'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          description: Telefon yoki parol noto'g'ri
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Refresh token qora ro'yxatga qo'shiladi (access o'z muddati tugaguncha
        amal qiladi — 15 daq).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: 'O''zgartirish mumkin: full_name, advocate_license_no, language'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Yangi access (va rotatsiya qilingan refresh). Refresh tanada bo'lmasa
        — HttpOnly cookie dan.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/billing/plans:
    get:
      operationId: billing_plans_list
      description: Tariflar sahifasi uchun (kirmagan foydalanuvchiga ham ochiq).
      tags:
      - billing
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
  /api/v1/billing/usage:
    get:
      operationId: billing_usage_retrieve
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
          description: ''
  /api/v1/cases/:
    get:
      operationId: cases_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - cases
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaseList'
          description: ''
    post:
      operationId: cases_create
      description: 'Ko''p fayl: `files` maydoni takrorlanadi. 429 — tarif limiti.'
      tags:
      - cases
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/cases/{run_id}:
    get:
      operationId: cases_retrieve
      description: Holat va progress (tahlil paytida 2–3 s da bir so'rang)
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cases
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
          description: ''
    delete:
      operationId: cases_destroy
      description: Ishni butunlay o'chirish (PDF, hisobot, yozuv). Tahlil ketayotganda
        — 409.
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cases
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/cases/{run_id}/confirmation:
    get:
      operationId: cases_confirmation_retrieve
      description: 'Tasdiq oynasi: keltirilgan moddalar, tasdiqlanmagan baholar, confirmed_at'
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cases
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    post:
      operationId: cases_confirmation_create
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
