<!doctype html>
<html lang="uz-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F4EC" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mezon</title>
    <script>
      /* Rejim birinchi chizishdan oldin (web-kit/lib/theme.tsx bilan bir xil kalit) */
      try { var p = localStorage.getItem("mezon.theme"); var d = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); document.documentElement.dataset.theme = d ? "dark" : "light"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
